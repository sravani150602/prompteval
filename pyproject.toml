[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompteval"
version = "0.1.0"
description = "Reproducible prompt evaluation service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0", "psycopg[binary]>=3.2,<4.0", "pydantic>=2.8,<3.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]  # FastAPI dependency injection convention.
