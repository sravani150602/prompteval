name: verify
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - name: Run evaluation smoke test
        env:
          DATABASE_URL: sqlite:///./ci_smoke.db
        run: python scripts/ci_smoke.py >> "$GITHUB_STEP_SUMMARY"
