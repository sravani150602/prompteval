services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prompteval
      POSTGRES_USER: prompteval
      POSTGRES_PASSWORD: prompteval
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prompteval -d prompteval"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://prompteval:prompteval@db:5432/prompteval
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
